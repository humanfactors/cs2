
//==============================================================
// MOVEMENT & CORE KEYS
//==============================================================
bind "tab"        "+showscores"
bind "mwheelup"   "+jump"                  // Jump on scroll up
bind "mwheeldown" "+jump"                  // Jump on scroll down
bind "mouse1"     "+attack"                // Primary fire
bind "mouse2"     "+attack2"               // Secondary fire / zoom
bind "mouse3"     "player_ping"            // Ping
bind "mouse4"     "+voicerecord"           // Push-to-talk
bind "9"          "+radar"                 // Hold to enlarge radar

//==============================================================
// RADIO
//==============================================================
bind "F5" "+radialradio3"
bind "F6" "+radialradio2"
bind "F7" "+radialradio1"

//==============================================================
// QUICK-SWITCH (toggle on P): rebinds Q to pull knife then back
//==============================================================
alias +qsw "slot3"
alias -qsw "slot1;slot2"
alias qsw_on  "bind q +qsw; echo QSW ON; alias toggleqs qsw_off"
alias qsw_off "bind q lastinv; echo QSW OFF; alias toggleqs qsw_on"
alias toggleqs qsw_on
bind "p" "toggleqs"
bind "q" "lastinv"                         // Default: last weapon

//==============================================================
// SPRAY MENU
//==============================================================
bind "H" "+spray_menu"                      // Hold to open spray/graffiti menu
bind "t" "+lookatweapon"                    // Hold to inspect weapon

//==============================================================
// CROSSHAIR RECOIL TOGGLE (F3)
//==============================================================
alias recoil_on  "cl_crosshair_recoil 1; cl_crosshair_t 1; alias recoil_toggle recoil_off"
alias recoil_off "cl_crosshair_recoil 0; cl_crosshair_t 0; alias recoil_toggle recoil_on"
alias recoil_toggle recoil_on
bind "F3" "recoil_toggle"

//==============================================================
// CROSSHAIR (cyan, style 4)
//==============================================================
cl_crosshairstyle 4
cl_crosshairsize 1
cl_crosshairthickness 1
cl_crosshairgap -4
cl_fixedcrosshairgap -6
cl_crosshairdot false
cl_crosshair_t false
cl_crosshaircolor 5
cl_crosshaircolor_r 0
cl_crosshaircolor_g 255
cl_crosshaircolor_b 255
cl_crosshairusealpha true
cl_crosshairalpha 155
cl_crosshair_recoil false
cl_crosshairgap_useweaponvalue false
cl_crosshair_drawoutline false
cl_crosshair_outlinethickness 1
cl_crosshair_dynamic_splitdist 7
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.5
cl_crosshair_dynamic_maxdist_splitratio 0.3
cl_crosshair_sniper_width 1
cl_crosshair_friendly_warning 1

//==============================================================
// HUD
//==============================================================
hud_scaling 0.9
hud_showtargetid 1
cl_hud_color 9
cl_showloadout 1
cl_teamcounter_playercount_instead_of_avatars 0
safezonex 1
safezoney 1
snd_voipvolume 1.0
r_drawtracers_firstperson 1                // Render own bullet tracers
cl_teamid_overhead_mode 3
cl_teamid_overhead_colors_show true
cl_allow_animated_avatars false

 
 
// alias "knifeinspect_on"  "-lookatweapon; slot3; +lookatweapon; alias knifeinspect_toggle knifeinspect_off"
// alias "knifeinspect_off" "-lookatweapon; slot1; slot2; alias knifeinspect_toggle knifeinspect_on"
// alias "knifeinspect_toggle" "knifeinspect_on"

alias +knifeinspect "slot3; +lookatweapon"
alias -knifeinspect "-lookatweapon; slot2; slot1"
bind "F" "+knifeinspect"

bind "/" "slot12"

//==============================================================
// BUY BINDS (numpad)
//==============================================================
bind "scancode77"   "buy vesthelm; buy vest; slot3"   // Numpad-equivalent: armour
bind "kp_0"         "buy awp; slot3"
bind "PGDN"         "buy fiveseven; slot3"
bind "kp_multiply"  "buy deagle; slot3"
bind "kp_divide"    "buy revolver; slot3"
bind "kp_minus"     "buy flashbang; slot3"
bind "kp_plus"      "buy ak47; buy m4a1; slot3"
bind "kp_enter"     "buy galilar; buy famas; slot3"
bind "DEL"          "buy defuser; slot3"
bind "kp_del"       "buy mac10; slot3"

//==============================================================
// GRENADE / EQUIP SELECT
//   F15 = top extra mouse btn, F16 = bottom extra mouse btn
//==============================================================
alias n_smoke "slot8; bind f15 n_last"
alias n_last "lastinv; bind f15 n_smoke"
bind "F15" "n_smoke"
bind "F16" "buy flashbang; slot7"               // Flash
bind "x"   "buy hegrenade; slot6"               // HE
bind "c"   "buy incgrenade; buy molotov; slot10" // Molotov / Incendiary
bind "5"   "slot5; slot12" // C4 / med-shot

//==============================================================
// SENSITIVITY
//==============================================================
sensitivity 0.85
zoom_sensitivity_ratio 1
 
//==============================================================
// RADAR (toggle zoom/default on MOUSE5)
//==============================================================
cl_radar_rotate 0
cl_radar_always_centered 0
cl_radar_square_with_scoreboard 1
 
alias radar_default "cl_hud_radar_scale 1; cl_radar_scale 0.6; cl_radar_icon_scale_min 0.6; cl_radar_rotate 0; cl_radar_always_centered 0; cl_radar_square_always 1; alias radar_switch radar_zoom"
alias radar_zoom    "cl_hud_radar_scale 1; cl_radar_scale 1.3; cl_radar_icon_scale_min 0.6; cl_radar_rotate 1; cl_radar_always_centered 1; cl_radar_square_always 0; alias radar_switch radar_default"
alias radar_switch radar_zoom
bind "MOUSE5" "radar_switch"
radar_default                              // Apply default radar state on load

//==============================================================
// VIEWMODEL
//==============================================================
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 0
viewmodel_offset_z -1.5
viewmodel_presetpos 1
 


//==============================================================
// Add damage reports
//==============================================================

con_filter_enable 2
con_filter_text "damage"
developer 1

// Clutch Mute
alias clutch_on "voice_enable 0; cl_mute_enemy_team 1; echo CLUTCH MODE; alias clutch clutch_off"
alias clutch_off "voice_enable 1; cl_mute_enemy_team 0; echo CLUTCH OFF; alias clutch clutch_on"
alias clutch clutch_on
bind "M" "clutch"
